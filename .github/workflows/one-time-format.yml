name: One-time extension formatter
on:
  push:
    branches: [extension]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: extension
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run black src tests
      - name: Save formatted files to extension
        run: |
          if ! git diff --quiet -- src tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: format extended scaffolding with Black"
            git push origin HEAD:extension
          fi
